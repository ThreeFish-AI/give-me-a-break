# Give me a break — 发布 CD（持续交付）· 多平台（macOS + Windows）。
# 触发：git tag v*（版本即 tag，不可变锚点）+ workflow_dispatch（手动补刀 / prerelease）。
# 架构（docs/windows-port-design.md §7）：单 workflow + 3 job 规避多 workflow 同 tag 竞态——
#   macos job（①-⑥ 现有链路逐字保留，演进式签名；③b 新增自签名稳定证书重签——TCC 授权跨版本持久）
#   + windows job（dotnet publish self-contained，无签名）
#   → release job（needs [macos, windows] 收敛）一次性 softprops/action-gh-release 挂双 asset。
# macOS 签名三态（signing marker 供 Release Note 分支）：devid（公证）> selfsign（稳定自签名）> adhoc；
# Windows 暂不签名（SmartScreen 告知，签名留后续）。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: '标记为预发布（pre-release）'
        required: false
        default: false
        type: boolean
      skip_notarize:
        description: '跳过公证（仅内测，慎用）'
        required: false
        default: false
        type: boolean

# 创建 Release + 上传 asset 必需 contents:write；其余默认 none（最小权限）。
permissions:
  contents: write

# 发布不可被取消（cancel-in-progress: false），避免半成品 Release 残留。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # macOS · 现有链路 ①-⑥ 逐字保留（演进式签名），仅末尾改 upload-artifact + markers。
  macos:
    name: Build & package (macOS)
    runs-on: macos-15   # macos-14 将于 2026-07-06 弃用（2026-11-02 下线）；macos-15 默认 Xcode 16.4/Swift 6.0.x，满足 README baseline 且消除 Swift warning。
    timeout-minutes: 45   # 公证高峰期预留（notarytool --wait 偶达 30+ min）
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup macOS + Swift (cached)
        uses: ./.github/actions/setup-macos-swift

      # ① 版本一致性校验（SSOT）：复用共享 action，macOS/Windows 双 job 同源强校验（堵原 Windows 不校验漏洞）。
      - name: Resolve version & verify tag↔Info.plist consistency
        id: ver
        uses: ./.github/actions/verify-version
      - name: Export RELEASE_VERSION
        run: echo "RELEASE_VERSION=${{ steps.ver.outputs.version }}" >> "$GITHUB_ENV"

      # ② 构建+装配（复用 make app 单一事实源；产物 ad-hoc 签名，结构可启动）。
      - name: Build & assemble GiveMeABreak.app
        run: make app

      # ③a 检测签名/公证 secrets 是否存在。
      - name: Detect signing/notarization secrets
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_SELFSIGN_P12: ${{ secrets.MACOS_SELFSIGN_P12 }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then echo "has_cert=true" >> "$GITHUB_OUTPUT"; else echo "has_cert=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$APPLE_ID" ]; then echo "has_notarize=true" >> "$GITHUB_OUTPUT"; else echo "has_notarize=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$MACOS_SELFSIGN_P12" ]; then echo "has_selfsign=true" >> "$GITHUB_OUTPUT"; else echo "has_selfsign=false" >> "$GITHUB_OUTPUT"; fi

      # ③ 条件 Developer ID 重签（演进升级；--force 覆盖 make app 的 ad-hoc 签名）。
      - name: Import cert & re-sign with Developer ID
        if: ${{ vars.ENABLE_DEVELOPER_ID_SIGNING == 'true' && steps.signing.outputs.has_cert == 'true' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          CERT_FILE=$(mktemp /tmp/dev_id.p12.XXXX)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_FILE"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT_FILE" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          echo "==> 可用签名 identity（排障）："
          security find-identity -v -p codesigning "$KC"
          codesign --force --deep --options runtime --timestamp \
            --entitlements Resources/GiveMeABreakRelease.entitlements \
            --keychain "$KC" -s "$SIGNING_IDENTITY" GiveMeABreak.app
          rm -f "$CERT_FILE"
          security delete-keychain "$KC"

      # ③b 条件自签名稳定证书重签（TCC 授权跨版本持久；与 ③ 互斥防双签）。
      # 所有 Release 共用同一张证书 → DR 稳定 → 下载用户升级后不再重复 TCC 授权（见 scripts/create-signing-cert.sh）。
      - name: Import self-signed cert & re-sign (stable TCC identity)
        if: ${{ steps.signing.outputs.has_selfsign == 'true' && !(vars.ENABLE_DEVELOPER_ID_SIGNING == 'true' && steps.signing.outputs.has_cert == 'true') }}
        env:
          MACOS_SELFSIGN_P12: ${{ secrets.MACOS_SELFSIGN_P12 }}
          MACOS_SELFSIGN_P12_PWD: ${{ secrets.MACOS_SELFSIGN_P12_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SELFSIGN_IDENTITY: ${{ vars.SELFSIGN_IDENTITY }}
        run: |
          set -euo pipefail
          [ -n "$SELFSIGN_IDENTITY" ] || { echo "::error::已配置 MACOS_SELFSIGN_P12 但缺少 repo variable SELFSIGN_IDENTITY（证书 CN，如 GiveMeABreak Release）"; exit 1; }
          CERT_FILE=$(mktemp /tmp/selfsign.p12.XXXX)
          CERT_PEM=$(mktemp /tmp/selfsign.cer.XXXX)
          echo "$MACOS_SELFSIGN_P12" | base64 --decode > "$CERT_FILE"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT_FILE" -P "$MACOS_SELFSIGN_P12_PWD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          # 自签名证书必须显式信任为 code signing 根，否则 find-identity 视为 invalid。
          # 信任必须经 sudo 写系统域：用户域 add-trusted-cert 在无头 runner 上会等待 GUI 授权
          # 确认而永久挂起（双 job 诊断实锤）；root 写系统域免 GUI（与本机 create-signing-cert.sh 指引同域）。
          openssl pkcs12 -in "$CERT_FILE" -passin "pass:$MACOS_SELFSIGN_P12_PWD" -nokeys -clcerts -out "$CERT_PEM"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$CERT_PEM"
          # 临时钥匙串置于用户搜索列表头再签名（GitHub 官方 Developer ID 流写法）：
          # runner 上对自签证书 codesign --keychain 找不到 identity（T2/T3 双变体诊断定位）。
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "==> 可用签名 identity（排障）："
          security find-identity -v -p codesigning "$KC"
          # 无 --timestamp：secure timestamp 仅公证（Developer ID）需要；自签证书下该请求
          # 向 timestamp.apple.com 发起，runner 网络上实测挂起 45min 无响应致 job 超时。
          codesign --force --deep --options runtime \
            --entitlements Resources/GiveMeABreakRelease.entitlements \
            -s "$SELFSIGN_IDENTITY" GiveMeABreak.app
          rm -f "$CERT_FILE" "$CERT_PEM"
          security delete-keychain "$KC"

      # ④ 条件公证（notarytool submit --wait + stapler staple）。
      - name: Notarize & staple
        if: ${{ vars.ENABLE_DEVELOPER_ID_SIGNING == 'true' && steps.signing.outputs.has_notarize == 'true' && github.event.inputs.skip_notarize != 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # ditto 保留 bundle 符号链接/权限；zip 会破坏符号链接致签名失效。
          ditto -c -k --keepParent "$GITHUB_WORKSPACE/GiveMeABreak.app" "give-me-a-break-${RELEASE_VERSION}-macos.zip"
          xcrun notarytool submit "give-me-a-break-${RELEASE_VERSION}-macos.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          cd "$GITHUB_WORKSPACE"
          xcrun stapler staple GiveMeABreak.app
          echo "NOTARIZED=true" >> "$GITHUB_ENV"

      # ⑤ 打包发布物（复用公证 zip 或现打）。
      - name: Package release zip
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          if [ ! -f "give-me-a-break-${RELEASE_VERSION}-macos.zip" ]; then
            ditto -c -k --keepParent "$GITHUB_WORKSPACE/GiveMeABreak.app" "give-me-a-break-${RELEASE_VERSION}-macos.zip"
          fi
          echo "RELEASE_ZIP=$RUNNER_TEMP/give-me-a-break-${RELEASE_VERSION}-macos.zip" >> "$GITHUB_ENV"

      # ⑥ Verification Before Done —— 发布前自证三件套（AGENTS.md「交付前验证定式」）。
      - name: Verify codesign integrity（always，ad-hoc 也校验结构完整性）
        run: codesign --verify --deep --strict --verbose=2 GiveMeABreak.app

      - name: Verify Gatekeeper & staple（only when notarized）
        if: env.NOTARIZED == 'true'
        run: |
          set -euo pipefail
          spctl -a -vvvv -t install GiveMeABreak.app
          xcrun stapler validate GiveMeABreak.app

      # ⑦ 上传 artifact（Release 创建上移到 release 收敛 job）+ 版本/公证/签名 markers（供 release job 跨 job 读取）。
      # 签名状态以产物实签为准（codesign Authority），不依赖步骤执行标志——冻结链路零改动。
      - name: Write version & notarized & signing markers
        run: |
          set -euo pipefail
          echo "${RELEASE_VERSION}" > version.txt
          echo "${NOTARIZED:-false}" > notarized.txt
          if codesign -dvvv GiveMeABreak.app 2>&1 | grep -q 'Authority=Developer ID'; then
            echo "devid" > signing.txt
          elif codesign -dvvv GiveMeABreak.app 2>&1 | grep -q '^Authority='; then
            echo "selfsign" > signing.txt
          else
            echo "adhoc" > signing.txt
          fi
          echo "==> 签名状态：$(cat signing.txt)"

      # ⑦b 发布门禁：ad-hoc 产物禁止流出。secrets 缺失曾致 ③b 静默跳过、v0.1.10 以 ad-hoc 发布，
      # 下载用户每次升级 TCC 授权失效（v0.1.8 修复只覆盖本机 make app 路径，CI 路径漏配）。
      # 按产物实签判定（对 Developer ID 误配同样生效）；逃生门 variable ALLOW_ADHOC_RELEASE=true（默认拒绝）。
      - name: Gate — block ad-hoc release artifacts
        env:
          ALLOW_ADHOC_RELEASE: ${{ vars.ALLOW_ADHOC_RELEASE }}
        run: |
          set -euo pipefail
          if [ "$(cat signing.txt)" = "adhoc" ] && [ "${ALLOW_ADHOC_RELEASE}" != "true" ]; then
            echo "::error::Release 产物为 ad-hoc 签名（secrets 缺失或证书导入失败）——TCC 授权将随每次升级失效，已阻断发布。请配置 secrets MACOS_SELFSIGN_P12 / MACOS_SELFSIGN_P12_PWD / KEYCHAIN_PASSWORD 与 variable SELFSIGN_IDENTITY（见 scripts/create-signing-cert.sh 尾部指引）；确需 ad-hoc 内测发布时临时设置 variable ALLOW_ADHOC_RELEASE=true。"
            exit 1
          fi

      - name: Upload macOS zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-zip
          path: ${{ env.RELEASE_ZIP }}
          if-no-files-found: error

      - name: Upload markers artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markers
          path: |
            version.txt
            notarized.txt
            signing.txt
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────
  # Windows · dotnet publish self-contained（对齐 ci.yml dotnet-build-shell 范式）· 无签名。
  windows:
    name: Build & package (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        # NOTE: 暂用 tag，待人工/Dependabot SHA-pin 对齐仓库其余 action 规范。
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # 版本：复用共享 verify-version action，与 macos job 同源强校验（堵原 Windows 不校验漏洞）。
      - name: Resolve version & verify consistency
        id: ver
        uses: ./.github/actions/verify-version
      - name: Export RELEASE_VERSION
        shell: bash
        run: echo "RELEASE_VERSION=${{ steps.ver.outputs.version }}" >> "$GITHUB_ENV"

      # publish self-contained（含 .NET 8 + WindowsDesktop runtime，免用户装 .NET；对齐 ci.yml 范式）。
      - name: Publish self-contained (win-x64)
        run: dotnet publish windows/GiveMeABreakShell/GiveMeABreakShell.csproj -c Release -r win-x64 --self-contained -p:Version=${{ env.RELEASE_VERSION }} -o ./publish --nologo

      - name: Package win64 zip
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath "give-me-a-break-${{ env.RELEASE_VERSION }}-win64.zip" -Force

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-zip
          path: give-me-a-break-${{ env.RELEASE_VERSION }}-win64.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────
  # Release 收敛 · needs [macos, windows] → 一次性 softprops 挂双 asset（规避多 workflow 竞态）。
  release:
    name: Create GitHub Release (dual asset)
    runs-on: ubuntu-latest
    needs: [macos, windows]
    timeout-minutes: 10
    steps:
      # 取仓库（含 CHANGELOG.md）以便把本版本章节注入 Release Note 正文。
      - name: Checkout (for CHANGELOG → Release Note)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download markers
        # NOTE: 暂用 tag，待 SHA-pin。
        uses: actions/download-artifact@v8
        with:
          name: markers

      - name: Download macOS zip
        uses: actions/download-artifact@v8
        with:
          name: macos-zip

      - name: Download Windows zip
        uses: actions/download-artifact@v8
        with:
          name: windows-zip

      - name: Resolve version & notarized & signing state
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=$(cat version.txt)" >> "$GITHUB_ENV"
          echo "NOTARIZED=$(cat notarized.txt)" >> "$GITHUB_ENV"
          SIGNING="$(cat signing.txt)"
          case "$SIGNING" in devid|selfsign|adhoc) ;; *) echo "::error::非法签名状态 marker：$SIGNING"; exit 1 ;; esac
          echo "SIGNING=$SIGNING" >> "$GITHUB_ENV"

      # download-artifact v4 解压到 <name>/ 子目录，归拢到当前目录供 softprops files: 引用。
      - name: Flatten asset layout & verify
        run: |
          set -euo pipefail
          mv macos-zip/*.zip . 2>/dev/null || true
          mv windows-zip/*.zip . 2>/dev/null || true
          ls -la give-me-a-break-*.zip
          test -f "give-me-a-break-${RELEASE_VERSION}-macos.zip"
          test -f "give-me-a-break-${RELEASE_VERSION}-win64.zip"

      # Release Note 正文 = CHANGELOG 本版本章节（「本次更新」）+ 安装说明（mac/win，按公证态分支）。
      - name: Build release notes (CHANGELOG + 安装说明)
        run: |
          set -euo pipefail
          SECTION=$(awk -v v="## v${RELEASE_VERSION}" '
            index($0, v)==1 {f=1; print; next}
            f && /^## / {exit}
            f {print}
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            echo "::warning::CHANGELOG 未找到 v${RELEASE_VERSION} 章节，正文回退仅安装说明。"
            SECTION="## Give me a break ${RELEASE_VERSION}"
          fi
          {
            printf '%s\n\n' "$SECTION"
            printf -- '---\n\n'
            printf '### macOS\n\n下载 `give-me-a-break-%s-macos.zip`。解压后将 `GiveMeABreak.app` 拖入 `/Applications`；首次启动需在「系统设置 → 隐私与安全性」授权辅助功能与媒体控制权限。\n\n' "$RELEASE_VERSION"
            if [ "${NOTARIZED}" = "true" ]; then
              printf '> ✅ 已通过 Apple 公证（Notarized）+ Developer ID 签名，Gatekeeper 可直接放行，双击即开。\n\n'
            elif [ "${SIGNING}" = "selfsign" ]; then
              printf '> 🔏 稳定自签名（未公证）。**TCC 权限（辅助功能/输入监控/日历）授权一次、升级后不再重复**。推荐一键安装（自动去隔离 + 装入 /Applications）：\n>\n> ```bash\n> curl -fsSL https://raw.githubusercontent.com/ThreeFish-AI/give-me-a-break/v%s/install.sh -o install.sh && bash install.sh v%s\n> ```\n>\n> 手动安装则解压拖入 `/Applications` 后执行 `xattr -dr com.apple.quarantine /Applications/GiveMeABreak.app`（macOS 15.1 Sequoia 起「右键→打开」已失效）。\n\n' "$RELEASE_VERSION" "$RELEASE_VERSION"
            else
              printf '> ⚠️ 此版本为 ad-hoc 签名（未签名/未公证）。首次打开会被 Gatekeeper 拦截，请执行 `xattr -dr com.apple.quarantine /Applications/GiveMeABreak.app` 放行（macOS 15.1 Sequoia 起「右键→打开」已失效），仅供内测。\n\n'
            fi
            printf '### Windows\n\n下载 `give-me-a-break-%s-win64.zip`。解压后运行 `GiveMeABreakShell.exe`。内置 .NET 8 运行时，**无需额外安装任何依赖**。\n\n' "$RELEASE_VERSION"
            printf '> ⚠️ **此 Windows 版本未签名**。首次运行会被 SmartScreen 拦截，请点击「更多信息 → 仍要运行」。`GiveMeABreakShell.exe` 可能被杀软（Defender / 360 / 火绒）误报（`WH_KEYBOARD_LL` 键盘钩子 + `SendInput` 媒体键触发），需手动加入信任。代码签名将在后续版本提供。\n'
          } > RELEASE_NOTES.md
          echo "==> RELEASE_NOTES.md 预览（前 30 行）："; sed -n '1,30p' RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Give me a break ${{ env.RELEASE_VERSION }}
          files: |
            give-me-a-break-${{ env.RELEASE_VERSION }}-macos.zip
            give-me-a-break-${{ env.RELEASE_VERSION }}-win64.zip
          fail_on_unmatched_files: true
          # 预发布：带连字符的语义化版本 tag（如 -rc.1 / -beta）自动标记 prerelease；workflow_dispatch 可显式覆盖。
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(github.ref, '-') }}
          # 仅正式版（无连字符且非 dispatch-prerelease）置为 Latest，避免预发布抢占 GA 的 Latest。
          make_latest: ${{ github.event.inputs.prerelease != 'true' && !contains(github.ref, '-') }}
          body_path: RELEASE_NOTES.md
